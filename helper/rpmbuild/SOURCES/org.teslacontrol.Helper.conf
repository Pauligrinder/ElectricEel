<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="teslacontrol">
    <allow own="org.teslacontrol.Helper"/>
  </policy>

  <!-- Sailfish's single-user device account; adjust if targeting multi-user. -->
  <policy user="defaultuser">
    <allow send_destination="org.teslacontrol.Helper" send_interface="org.teslacontrol.Helper1"/>
    <allow receive_sender="org.teslacontrol.Helper"/>
  </policy>

  <policy context="default">
    <deny send_destination="org.teslacontrol.Helper"/>
  </policy>
</busconfig>
