[package]
name = "teslacontrold"
version = "0.1.5"
edition = "2021"
description = "Privileged BLE helper service for harbour-teslacontrol"

[[bin]]
name = "teslacontrold"
path = "src/main.rs"

[lints.clippy]
pedantic = "warn"

[dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
wait-timeout = "0.2"
tempfile = "3.27.0"
procfs = { version = "0.18.0", default-features = false }

[profile.release]
strip = true
lto = true
