name: CI

# Runs the real quality gates on every push and pull request, independent of
# the release packaging workflow (release.yml builds/checks/publishes the RPM and
# never exercised the test suites - see the old KNOWN gap where "CI green" did
# not mean "tests pass"). Gates mirror the local dev commands:
#   Rust: cargo fmt --check, cargo clippy -- -D warnings, cargo test --all-features
#   Go  : enforce gofmt, go vet ./..., go test -race ./...
#   QML : qmllint syntax over app/qml
#   i18n: tools/build-qm.sh --check (catalogs in sync)
#   RPM : mb2 build, mb2 check --suites harbour (Sailfish SDK, aarch64)
#
# The slower SDK packaging gate runs independently of the fast host checks.

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  go:
    name: Go session (gofmt, vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helper/session
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # matches helper/session/go.mod
          go-version: '1.26.5'
      - name: Enforce Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...

  qml:
    name: QML lint (qmllint syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt QML tools
        run: sudo apt-get update && sudo apt-get install -y qtdeclarative5-dev-tools qtbase5-dev
      - name: qmllint syntax check
        # Qt 5.15 qmllint is a pure syntax verifier: it parses QML with
        # QQmlJS and never resolves imports, so the Sailfish-only modules
        # (Sailfish.Silica, Sailfish.Share, Nemo.*) cannot cause false
        # positives. Non-zero exit means a real syntax error.
        run: |
          export PATH="$PATH:/usr/lib/qt5/bin:/usr/lib/x86_64-linux-gnu/qt5/bin"
          command -v qmllint
          qmllint app/qml/harbour-electric-eel.qml app/qml/cover/*.qml app/qml/pages/*.qml
      - name: Qt command argument regression tests
        run: |
          g++ -std=c++11 -fPIC $(pkg-config --cflags Qt5Core) \
            app/tests/commandarguments_test.cpp -o "$RUNNER_TEMP/commandarguments_test" \
            $(pkg-config --libs Qt5Core)
          "$RUNNER_TEMP/commandarguments_test"
      - name: Qt configuration admission regression test
        run: |
          /usr/lib/qt5/bin/moc app/src/teslaclient.h -o "$RUNNER_TEMP/moc_teslaclient.cpp"
          g++ -std=c++11 -fPIC -DAPP_VERSION=\"test\" \
            -Iapp/tests/runtime_stub $(pkg-config --cflags Qt5Core Qt5Gui) \
            app/tests/configload_test.cpp app/src/teslaclient.cpp "$RUNNER_TEMP/moc_teslaclient.cpp" \
            -o "$RUNNER_TEMP/configload_test" $(pkg-config --libs Qt5Core Qt5Gui)
          "$RUNNER_TEMP/configload_test"

  qml-logic:
    name: QML JavaScript logic regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test app/tests/*_test.cjs

  i18n:
    name: Translations freshness (lupdate/lrelease)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild catalogs and fail on drift
        # tools/build-qm.sh bootstraps Qt linguist tools from the PySide6
        # wheel (no system Qt needed) and fails when the committed
        # app/translations/*.ts/*.qm differ from a fresh extraction — so UI
        # string changes can never ship without updated catalogs.
        run: bash tools/build-qm.sh --check

  harbour:
    name: RPM build and Harbour validation (aarch64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for the Sailfish SDK image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo apt-get clean
          df -h

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Pull Sailfish Platform SDK
        run: docker pull coderus/sailfishos-platform-sdk-aarch64

      - name: Stage the in-app core bundle (staticlib + Go protocol library)
        run: ./helper/make-app-bundle.sh

      - name: Build RPM and run Harbour validation
        run: |
          set -euxo pipefail
          docker create --name electric-eel-build coderus/sailfishos-platform-sdk-aarch64 sleep infinity
          trap 'docker rm -f electric-eel-build >/dev/null 2>&1 || true' EXIT
          docker start electric-eel-build

          docker cp app electric-eel-build:/home/mersdk/app
          docker exec -u root electric-eel-build chown -R mersdk:mersdk /home/mersdk/app
          docker exec -w /home/mersdk/app electric-eel-build \
            mb2 --target SailfishOS-5.2.0.15-aarch64 build
          docker exec -w /home/mersdk/app electric-eel-build \
            mb2 --target SailfishOS-5.2.0.15-aarch64 check --suites harbour
